<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="850" height="420" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#d9534f" />
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0275d8" />
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#5cb85c" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="425" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#333333">Question 1: Image Gradient Calculation at Pixel I(2,2)</text>

  <!-- Left: Patch Grid -->
  <g transform="translate(60, 70)">
    <text x="140" y="-10" font-size="16" font-weight="bold" text-anchor="middle" fill="#444">4x4 Image Patch I</text>
    
    <!-- Column Headers -->
    <text x="35" y="15" font-size="12" text-anchor="middle" fill="#777">x=1</text>
    <text x="105" y="15" font-size="12" text-anchor="middle" fill="#777">x=2</text>
    <text x="175" y="15" font-size="12" text-anchor="middle" fill="#777">x=3</text>
    <text x="245" y="15" font-size="12" text-anchor="middle" fill="#777">x=4</text>

    <!-- Row Headers -->
    <text x="-15" y="60" font-size="12" text-anchor="middle" fill="#777">y=1</text>
    <text x="-15" y="130" font-size="12" text-anchor="middle" fill="#777">y=2</text>
    <text x="-15" y="200" font-size="12" text-anchor="middle" fill="#777">y=3</text>
    <text x="-15" y="270" font-size="12" text-anchor="middle" fill="#777">y=4</text>

    <!-- Grid Cells -->
    <!-- Row 1 -->
    <rect x="0" y="25" width="70" height="70" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
    <text x="35" y="65" font-size="16" text-anchor="middle" fill="#333">10</text>
    <rect x="70" y="25" width="70" height="70" fill="#e8f4f8" stroke="#0275d8" stroke-width="2"/>
    <text x="105" y="65" font-size="16" font-weight="bold" text-anchor="middle" fill="#0275d8">10</text>
    <text x="105" y="85" font-size="10" text-anchor="middle" fill="#0275d8">I(2,1)</text>
    <rect x="140" y="25" width="70" height="70" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
    <text x="175" y="65" font-size="16" text-anchor="middle" fill="#333">10</text>
    <rect x="210" y="25" width="70" height="70" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
    <text x="245" y="65" font-size="16" text-anchor="middle" fill="#333">10</text>

    <!-- Row 2 -->
    <rect x="0" y="95" width="70" height="70" fill="#e8f8e8" stroke="#5cb85c" stroke-width="2"/>
    <text x="35" y="135" font-size="16" font-weight="bold" text-anchor="middle" fill="#5cb85c">10</text>
    <text x="35" y="155" font-size="10" text-anchor="middle" fill="#5cb85c">I(1,2)</text>
    
    <!-- Center (2,2) -->
    <rect x="70" y="95" width="70" height="70" fill="#fff3cd" stroke="#ffc107" stroke-width="3"/>
    <text x="105" y="135" font-size="18" font-weight="bold" text-anchor="middle" fill="#856404">20</text>
    <text x="105" y="155" font-size="11" font-weight="bold" text-anchor="middle" fill="#856404">I(2,2)</text>

    <rect x="140" y="95" width="70" height="70" fill="#e8f8e8" stroke="#5cb85c" stroke-width="2"/>
    <text x="175" y="135" font-size="16" font-weight="bold" text-anchor="middle" fill="#5cb85c">30</text>
    <text x="175" y="155" font-size="10" text-anchor="middle" fill="#5cb85c">I(3,2)</text>
    <rect x="210" y="95" width="70" height="70" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
    <text x="245" y="135" font-size="16" text-anchor="middle" fill="#333">40</text>

    <!-- Row 3 -->
    <rect x="0" y="165" width="70" height="70" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
    <text x="35" y="205" font-size="16" text-anchor="middle" fill="#333">10</text>
    <rect x="70" y="165" width="70" height="70" fill="#e8f4f8" stroke="#0275d8" stroke-width="2"/>
    <text x="105" y="205" font-size="16" font-weight="bold" text-anchor="middle" fill="#0275d8">30</text>
    <text x="105" y="225" font-size="10" text-anchor="middle" fill="#0275d8">I(2,3)</text>
    <rect x="140" y="165" width="70" height="70" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
    <text x="175" y="205" font-size="16" text-anchor="middle" fill="#333">50</text>
    <rect x="210" y="165" width="70" height="70" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
    <text x="245" y="205" font-size="16" text-anchor="middle" fill="#333">70</text>

    <!-- Row 4 -->
    <rect x="0" y="235" width="70" height="70" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
    <text x="35" y="275" font-size="16" text-anchor="middle" fill="#333">10</text>
    <rect x="70" y="235" width="70" height="70" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
    <text x="105" y="275" font-size="16" text-anchor="middle" fill="#333">40</text>
    <rect x="140" y="235" width="70" height="70" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
    <text x="175" y="275" font-size="16" text-anchor="middle" fill="#333">70</text>
    <rect x="210" y="235" width="70" height="70" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
    <text x="245" y="275" font-size="16" text-anchor="middle" fill="#333">100</text>
  </g>

  <!-- Right: Vector Diagram -->
  <g transform="translate(480, 80)">
    <text x="150" y="-20" font-size="16" font-weight="bold" text-anchor="middle" fill="#444">Gradient Vector & Orientation</text>

    <!-- Axes -->
    <line x1="40" y1="260" x2="280" y2="260" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="295" y="265" font-size="14" font-weight="bold" fill="#555">Gx</text>
    
    <line x1="40" y1="260" x2="40" y2="40" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="40" y="25" font-size="14" font-weight="bold" fill="#555">Gy</text>
    
    <text x="25" y="275" font-size="14" fill="#666">0</text>

    <!-- Triangle Legs -->
    <!-- Gx = 10 (horizontal line) -->
    <line x1="40" y1="260" x2="200" y2="260" stroke="#5cb85c" stroke-width="4"/>
    <text x="120" y="285" font-size="14" font-weight="bold" fill="#5cb85c" text-anchor="middle">Gx = 10</text>

    <!-- Gy = 10 (vertical dashed line) -->
    <line x1="200" y1="260" x2="200" y2="100" stroke="#0275d8" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="245" y="185" font-size="14" font-weight="bold" fill="#0275d8" text-anchor="middle">Gy = 10</text>

    <!-- Resultant Vector M -->
    <line x1="40" y1="260" x2="197" y2="103" stroke="#d9534f" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="95" y="160" font-size="15" font-weight="bold" fill="#d9534f" transform="rotate(-45, 95, 160)">M = 14.14</text>

    <!-- Angle Arc -->
    <path d="M 90 260 A 50 50 0 0 0 75 225" fill="none" stroke="#e67e22" stroke-width="3"/>
    <text x="105" y="235" font-size="14" font-weight="bold" fill="#e67e22">θ = 45°</text>

    <!-- Formulas box -->
    <rect x="20" y="305" width="280" height="45" rx="5" fill="#f8f9fa" stroke="#ccc"/>
    <text x="35" y="325" font-size="12" fill="#333">Gx = (30 - 10) / 2 = 10</text>
    <text x="175" y="325" font-size="12" fill="#333">Gy = (30 - 10) / 2 = 10</text>
    <text x="35" y="342" font-size="12" font-weight="bold" fill="#d9534f">M = √(10² + 10²) = 14.14</text>
    <text x="175" y="342" font-size="12" font-weight="bold" fill="#e67e22">θ = tan⁻¹(1) = 45°</text>
  </g>
</svg>