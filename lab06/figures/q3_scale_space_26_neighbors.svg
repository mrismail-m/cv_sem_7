<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="850" height="480" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#28a745" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="425" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#333333">Question 3: Keypoint Detection & 26 Scale-Space Neighbors</text>

  <!-- Left: 2D Spatial Neighborhood (Local Max Test) -->
  <g transform="translate(60, 70)">
    <text x="110" y="0" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">2D Spatial Neighborhood D</text>
    <text x="110" y="20" font-size="13" text-anchor="middle" fill="#7f8c8d">Center (15) vs 8 Spatial Neighbors</text>

    <!-- 3x3 Grid -->
    <g transform="translate(20, 40)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="60" height="60" fill="#f8f9fa" stroke="#ccc" stroke-width="2"/>
      <text x="30" y="38" font-size="18" text-anchor="middle" fill="#555">5</text>
      <rect x="60" y="0" width="60" height="60" fill="#f8f9fa" stroke="#ccc" stroke-width="2"/>
      <text x="90" y="38" font-size="18" text-anchor="middle" fill="#555">8</text>
      <rect x="120" y="0" width="60" height="60" fill="#f8f9fa" stroke="#ccc" stroke-width="2"/>
      <text x="150" y="38" font-size="18" text-anchor="middle" fill="#555">6</text>

      <!-- Row 2 -->
      <rect x="0" y="60" width="60" height="60" fill="#f8f9fa" stroke="#ccc" stroke-width="2"/>
      <text x="30" y="98" font-size="18" text-anchor="middle" fill="#555">7</text>
      
      <!-- Center -->
      <rect x="60" y="60" width="60" height="60" fill="#d4edda" stroke="#28a745" stroke-width="3"/>
      <text x="90" y="98" font-size="22" font-weight="bold" fill="#155724" text-anchor="middle">15</text>
      
      <rect x="120" y="60" width="60" height="60" fill="#f8f9fa" stroke="#ccc" stroke-width="2"/>
      <text x="150" y="98" font-size="18" text-anchor="middle" fill="#555">9</text>

      <!-- Row 3 -->
      <rect x="0" y="120" width="60" height="60" fill="#f8f9fa" stroke="#ccc" stroke-width="2"/>
      <text x="30" y="158" font-size="18" text-anchor="middle" fill="#555">4</text>
      <rect x="60" y="120" width="60" height="60" fill="#f8f9fa" stroke="#ccc" stroke-width="2"/>
      <text x="90" y="158" font-size="18" text-anchor="middle" fill="#555">10</text>
      <rect x="120" y="120" width="60" height="60" fill="#f8f9fa" stroke="#ccc" stroke-width="2"/>
      <text x="150" y="158" font-size="18" text-anchor="middle" fill="#555">3</text>
    </g>

    <!-- Condition check -->
    <rect x="0" y="250" width="220" height="120" rx="6" fill="#e8f5e9" stroke="#81c784"/>
    <text x="110" y="275" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">Spatial Maximum Test:</text>
    <text x="110" y="300" font-size="12" fill="#1b5e20" text-anchor="middle">15 &gt; 5, 8, 6, 7, 9, 4, 10, 3</text>
    <text x="110" y="325" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">✓ Local Spatial Maximum</text>
    <text x="110" y="350" font-size="11" fill="#555" text-anchor="middle">(Needs 3D scale-space test!)</text>
  </g>

  <!-- Right: 3D Scale-Space 26-Neighbors -->
  <g transform="translate(360, 60)">
    <text x="220" y="10" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Full 3D Scale-Space Extremum Test (26 Neighbors)</text>

    <!-- Upper Scale Plane (σ + 1) -->
    <g transform="translate(100, 30)">
      <polygon points="0,50 140,0 240,50 100,100" fill="#ebf5fb" stroke="#3498db" stroke-width="2"/>
      <text x="250" y="45" font-size="13" font-weight="bold" fill="#2980b9">Upper Scale (σ + 1)</text>
      <text x="250" y="65" font-size="12" fill="#555">9 Neighbors</text>
      <!-- 9 points on grid -->
      <circle cx="50" cy="50" r="5" fill="#3498db"/>
      <circle cx="85" cy="37" r="5" fill="#3498db"/>
      <circle cx="120" cy="25" r="5" fill="#3498db"/>
      <circle cx="85" cy="62" r="5" fill="#3498db"/>
      <circle cx="120" cy="50" r="5" fill="#3498db"/>
      <circle cx="155" cy="37" r="5" fill="#3498db"/>
      <circle cx="120" cy="75" r="5" fill="#3498db"/>
      <circle cx="155" cy="62" r="5" fill="#3498db"/>
      <circle cx="190" cy="50" r="5" fill="#3498db"/>
    </g>

    <!-- Current Scale Plane (σ) -->
    <g transform="translate(100, 140)">
      <polygon points="0,50 140,0 240,50 100,100" fill="#eafaf1" stroke="#2ecc71" stroke-width="2"/>
      <text x="250" y="45" font-size="13" font-weight="bold" fill="#27ae60">Current Scale (σ)</text>
      <text x="250" y="65" font-size="12" fill="#555">8 Spatial Neighbors + Candidate</text>
      <!-- 8 neighbor points -->
      <circle cx="50" cy="50" r="5" fill="#7f8c8d"/>
      <circle cx="85" cy="37" r="5" fill="#7f8c8d"/>
      <circle cx="120" cy="25" r="5" fill="#7f8c8d"/>
      <circle cx="85" cy="62" r="5" fill="#7f8c8d"/>
      <!-- CANDIDATE (CENTER) -->
      <circle cx="120" cy="50" r="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
      <text x="120" y="45" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">X</text>
      <circle cx="155" cy="37" r="5" fill="#7f8c8d"/>
      <circle cx="120" cy="75" r="5" fill="#7f8c8d"/>
      <circle cx="155" cy="62" r="5" fill="#7f8c8d"/>
      <circle cx="190" cy="50" r="5" fill="#7f8c8d"/>
    </g>

    <!-- Lower Scale Plane (σ - 1) -->
    <g transform="translate(100, 250)">
      <polygon points="0,50 140,0 240,50 100,100" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
      <text x="250" y="45" font-size="13" font-weight="bold" fill="#d68910">Lower Scale (σ - 1)</text>
      <text x="250" y="65" font-size="12" fill="#555">9 Neighbors</text>
      <!-- 9 points on grid -->
      <circle cx="50" cy="50" r="5" fill="#f39c12"/>
      <circle cx="85" cy="37" r="5" fill="#f39c12"/>
      <circle cx="120" cy="25" r="5" fill="#f39c12"/>
      <circle cx="85" cy="62" r="5" fill="#f39c12"/>
      <circle cx="120" cy="50" r="5" fill="#f39c12"/>
      <circle cx="155" cy="37" r="5" fill="#f39c12"/>
      <circle cx="120" cy="75" r="5" fill="#f39c12"/>
      <circle cx="155" cy="62" r="5" fill="#f39c12"/>
      <circle cx="190" cy="50" r="5" fill="#f39c12"/>
    </g>

    <!-- Summary Total Box -->
    <rect x="50" y="370" width="370" height="40" rx="5" fill="#2c3e50"/>
    <text x="235" y="395" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
      Total Comparison: 9 + 8 + 9 = 26 Neighbors
    </text>
  </g>
</svg>